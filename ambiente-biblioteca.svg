<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<defs>
 <linearGradient id="wall" x2="0" y2="1"><stop stop-color="#18244d"/><stop offset="1" stop-color="#111a38"/></linearGradient>
 <linearGradient id="floor" x2="0" y2="1"><stop stop-color="#26345d"/><stop offset="1" stop-color="#10172e"/></linearGradient>
 <linearGradient id="glass" x2="1" y2="1"><stop stop-color="#172b59"/><stop offset="1" stop-color="#10172e"/></linearGradient>
 <linearGradient id="desk" x2="0" y2="1"><stop stop-color="#bd805e"/><stop offset="1" stop-color="#71435b"/></linearGradient>
 <linearGradient id="screen" x2="1" y2="1"><stop stop-color="#3c63c9"/><stop offset="1" stop-color="#713cc1"/></linearGradient>
 <filter id="glow"><feGaussianBlur stdDeviation="18"/></filter>
 <filter id="soft"><feGaussianBlur stdDeviation="5"/></filter>
</defs>
<rect width="1920" height="1080" fill="url(#wall)"/>
<rect y="730" width="1920" height="350" fill="url(#floor)"/>
