<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca Dev | Acesso</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="auth-page">
  <header class="topbar">
    <a class="brand" href="index.html"><span class="brand-icon">▤</span><span><b>Biblioteca Dev</b><small>Livros que constroem seu futuro</small></span></a>
    <nav><a href="index.html">Início</a><a href="index.html#acervo">Acervo</a><a href="perfil.html">Meu perfil</a></nav>
  </header>
  <main class="auth-wrap">
    <section class="auth-card">
      <div class="auth-brand"><span class="brand-icon">▤</span><h1>Biblioteca Dev</h1><p>Acesse sua área de leitura</p></div>
      <div class="tabs"><button class="tab active" data-tab="login">Entrar</button><button class="tab" data-tab="register">Criar conta</button></div>
      <form id="login-form">
        <label for="login-user">E-mail ou nome de usuário</label><input id="login-user" required placeholder="seu@email.com ou usuário">
        <label for="login-password">Senha</label><input id="login-password" type="password" required placeholder="Digite sua senha">
        <div class="form-line"><label class="check"><input type="checkbox"> Lembrar-me</label><a href="#" id="forgot">Esqueci minha senha</a></div>
        <button class="button full" type="submit">Entrar</button>
      </form>
      <form id="register-form" class="hidden">
        <label for="new-name">Nome de usuário</label><input id="new-name" required placeholder="Como deseja ser chamado?">
        <label for="new-email">E-mail</label><input id="new-email" type="email" required placeholder="seu@email.com">
        <label for="new-password">Criar senha</label><input id="new-password" type="password" required minlength="6" placeholder="Mínimo de 6 caracteres">
        <button class="button full" type="submit">Criar minha conta</button>
      </form>
      <div class="divider"><span>ou</span></div>
      <a class="button button-outline full" href="perfil.html">Acesso de demonstração do leitor</a>
      <button class="admin-link" id="admin-access" type="button">Acesso do administrador</button>
      <p class="notice">O acesso administrativo será conectado ao sistema de permissões do projeto.</p>
      <a class="back-link" href="index.html">← Voltar para o acervo</a>
    </section>
  </main>
  <script src="script.js"></script>
</body>
</html>
